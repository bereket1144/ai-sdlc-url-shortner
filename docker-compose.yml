services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: agentcontroller
      POSTGRES_USER: agentcontroller
      POSTGRES_PASSWORD: agentcontroller
    ports:
      # 5433 on the host, so it does not clash with a PostgreSQL already using 5432
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentcontroller -d agentcontroller"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
