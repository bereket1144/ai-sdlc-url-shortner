# Settings for a real run on a model reached through OpenRouter: start the controller with
# --spring.profiles.active=live. The key is read from the environment and never written in a file:
# export OPENROUTER_API_KEY first. The model is OPENROUTER_MODEL (default: deepseek/deepseek-chat); set the
# window and the answer limit below to what OpenRouter lists for the model you choose.
agent.models.profiles.router.api-style=openai
agent.models.profiles.router.model=${OPENROUTER_MODEL:deepseek/deepseek-chat}
agent.models.profiles.router.base-address=https://openrouter.ai/api/v1
agent.models.profiles.router.context-window=64000
agent.models.profiles.router.answer-limit=12000
agent.models.profiles.router.call-timeout=300s
agent.models.profiles.router.api-key=${OPENROUTER_API_KEY}
agent.models.primary=router

# Every stage runs on its agent.
agent.stages.requirements=agent
agent.stages.design=agent
agent.stages.planning=agent
agent.stages.development=agent
agent.stages.qa=agent
agent.stages.review=agent
agent.stages.documentation=agent

# Each run works in its own clone of this repository, outside the controller's checkout. The controller is started
# from agent-controller/, so ".." is the repository.
workspace.base=../../agentic-sdlc-workspaces
workspace.source=..

# A hosted model may see larger prompts than the local one, so the run may use more estimated tokens.
agent.budget.max-estimated-tokens-per-run=1000000
