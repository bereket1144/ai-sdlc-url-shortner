spring.application.name=agent-controller

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Local development database: the PostgreSQL from the root docker-compose.yml (host port 5433)
spring.datasource.url=jdbc:postgresql://localhost:5433/agentcontroller
spring.datasource.username=agentcontroller
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:agentcontroller}

# Background start of CREATED runs. The values below are the defaults and are left commented out so that the
# code stays the one place that defines them.
# run.dispatch.polling-enabled=true
# run.dispatch.poll-delay-ms=5000

# ---------------------------------------------------------------------------------------------------------------
# Models the agents call (agent.models.*). A profile describes one model and its limits; the part after
# "profiles." is its name. Moving to another model is a change here and nothing else.
# Any value can be overridden by an environment variable (upper case, dots become underscores), for example
# AGENT_MODELS_PROFILES_LOCAL_MODEL=qwen2.5-coder:3b. Write profile names in lower case so that this works.
# This file never holds a secret: the key of a hosted model comes from the environment only.
# ---------------------------------------------------------------------------------------------------------------
# The trial model, served by a local Ollama server. Its context length is 32,768 tokens.
agent.models.profiles.local.model=qwen2.5-coder:7b
agent.models.profiles.local.base-address=http://localhost:11434
agent.models.profiles.local.context-window=32768
agent.models.profiles.local.answer-limit=4096
agent.models.profiles.local.call-timeout=300s
# Left out here because these are the defaults: max-concurrent-calls=1, retry-limit=2, temperature=0, no api-key.
# Every role uses the primary profile unless it is assigned another one below.
agent.models.primary=local
# agent.models.fallback=<profile name>
# agent.models.roles.<role>=<profile name>
# agent.models.safety-margin-percent=10
# agent.models.retry-delay=200ms
# The same per-role cap applies independently to each role. All limits are checked from stored call records.
# agent.budget.max-calls-per-run=100
# agent.budget.max-calls-per-role=20
# agent.budget.max-estimated-tokens-per-run=200000
#
# Example of a hosted model. Set HOSTED_MODEL_API_KEY in the environment; never write the key itself in a file.
# agent.models.profiles.hosted.model=<model identifier>
# agent.models.profiles.hosted.base-address=https://<host>
# agent.models.profiles.hosted.context-window=200000
# agent.models.profiles.hosted.answer-limit=16000
# agent.models.profiles.hosted.call-timeout=120s
# agent.models.profiles.hosted.api-key=${HOSTED_MODEL_API_KEY}
# A profile with an api-key is called through the hosted messages API (POST <base-address>/v1/messages); a profile
# without one is called through the local Ollama API. The key is sent as a header and is never logged.
# The opt-in live check (-Dagent.model.hosted-live-check=true) reads the same settings from the environment, for
# example AGENT_MODELS_PRIMARY=hosted and AGENT_MODELS_PROFILES_HOSTED_API_KEY.

# ---------------------------------------------------------------------------------------------------------------
# Replay of recorded model answers (agent.model-client.*). The default is "live": the models above are called.
# With "replay" no model is called: answers and failures come from a recording file written by the recorder, and
# a call the recording does not hold fails with REPLAY_MISSING. The recording is required in replay mode.
# ---------------------------------------------------------------------------------------------------------------
# agent.model-client.mode=replay
# agent.model-client.recording=recordings/<scenario>.json

# ---------------------------------------------------------------------------------------------------------------
# Which node runs each stage (agent.stages.<role>). The default is the dummy node, so a run needs no model.
# Set a role to "agent" to run that stage with its agent. The roles are requirements, impactAnalysis, design,
# planning, development, qa, review and documentation. For every role but requirements, a value other than
# agent or dummy stops the start.
# For example, to run the design and planning stages on a model:
# agent.stages.design=agent
# agent.stages.planning=agent
# ---------------------------------------------------------------------------------------------------------------
# agent.stages.requirements=agent
# How many more times a stage is attempted after it fails with OUTPUT_INVALID, MODEL_UNAVAILABLE,
# VERIFICATION_FAILED or an unexpected error. Any other failure ends the run at once. The default is 2; 0 is none.
# agent.stage.max-retries=2
# How many attempts a run may have in all, the first one included. A FAILED run is queued again by
# POST /v1/runs/{id}/retry until it has used them: the first retry resumes at the earliest stage that is not
# finished, a later one starts from the beginning. The default is 3; 1 means a run is never retried.
# agent.run.max-attempts=3

# ---------------------------------------------------------------------------------------------------------------
# Approval of a stage's result before the run goes on (agent.approval.*). required-for lists the stages whose result
# a reviewer must approve: design, planning, or both, comma separated. A listed stage that runs on its agent stops
# the run after it has stored its artifact, and the run waits (WAITING_FOR_INPUT) for POST /v1/runs/{id}/decisions.
# The default is empty: no run waits. max-rejections is how many rejections of one stage end the run FAILED with the
# reason REJECTED (default 3).
# ---------------------------------------------------------------------------------------------------------------
# agent.approval.required-for=design,planning
# agent.approval.max-rejections=3

# ---------------------------------------------------------------------------------------------------------------
# The run workspace (workspace.*). It exists only when agent.stages.development=agent, and then workspace.base and
# workspace.repository are required. Each run is a git worktree of the platform repository (git worktree add) in
# <base>/<run-id>, on a new branch run/<run-id> cut from base-ref, with a sparse checkout of the product folder and of
# runs/<run-id>/ only. A run that changes an earlier run (kind BROWNFIELD with a baseRunId) is cut from the branch
# run/<base-run-id> instead. Workspace creation and development commits leave the controller checkout unchanged.
# Automatic delivery, when enabled below, merges completed work into that checkout. The controller never switches
# branches, pushes or deletes a branch. The git command line must be installed where the controller runs.
# ---------------------------------------------------------------------------------------------------------------
# workspace.base=/workspaces
# The root of the platform repository, a folder that holds a .git. Relative paths start at the folder the controller
# is started from.
# workspace.repository=/path/to/this/repository
# The commit a new branch is cut from (default HEAD, the commit checked out in the repository).
# workspace.base-ref=HEAD
# The product folder, relative to the root of the repository: where the files of an agent are written.
workspace.product-folder=apps/url-shortener

# When true, completion merges the run branch into a clean repository checkout before recording success.
# Local edits, an active Git operation or a merge conflict block delivery; the run branch is retained for retry.
# Requires Git 2.38 or newer for the conflict preflight. The live profile enables this.
workspace.auto-merge=false

# -------------------------------------------------------------------------------------------------------------
# Sandbox for builds and tests (sandbox.verify.*). Each verification runs in a new container that is removed
# afterwards: non-root with no capabilities and no new privileges, no network, limits on memory, CPUs, processes
# and time, and no host folder mounted. The workspace is copied in to /workspace and only the report file is copied
# out. The image is built outside the application (docker build -t agent-sandbox-python docker/sandbox-python). The
# command must write a JUnit XML report to the report path. Only the files of the run's product folder are copied in,
# so the command runs from the root of the product. The command below copies the workspace first so that the tests
# can write files. The tests run from that root, so python -m pytest finds the modules next to the tests folder.
# ---------------------------------------------------------------------------------------------------------------
sandbox.verify.image=agent-sandbox-python:latest
sandbox.verify.command=cp -r /workspace /tmp/work && cd /tmp/work && python -m pytest -q -p no:cacheprovider --junitxml=/tmp/junit.xml
# What the agents are told about this sandbox, so that no code names a language or a test tool. Change these together
# with the command above when the sandbox runs another language or test tool; either one may be left out.
# execution-context is put in front of every task of the requirements agent; file-layout is added to the task of the
# development agent and has to fit the command above.
sandbox.verify.execution-context=Execution context: Python standard library, SQLite storage and pytest are fixed for \
  this version. Tests run offline in a container. Do not ask the user to choose these.
sandbox.verify.file-layout=Use a flat layout: put the modules next to each other in the repository root and all the \
  tests in one tests/ folder. Do not add an extra nested package folder and do not put the files in a folder named \
  after the product. Never give a module the name of a Python standard library module (for example http, json, \
  logging, queue, random, string, types or test): it hides the library and breaks every import. Use a specific name \
  such as http_api.
# Left out here because these are the defaults:
# sandbox.verify.report-path=/tmp/junit.xml
# sandbox.verify.memory=1g
# sandbox.verify.cpus=1
# sandbox.verify.pids-limit=256
# sandbox.verify.timeout=5m
